<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>SB Monogram — Brand Sheet</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500&family=Source+Sans+3:wght@600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root { --gold: #a88d5f; --gold-soft: #c3ad85; }
      html, body { overflow: hidden; }
      body { margin: 0; font-family: 'Source Sans 3', sans-serif; }
      .panel { display: flex; align-items: center; justify-content: center; gap: 44px; width: 900px; height: 460px; }
      .dark { background: #0e1726; color: #eee9df; --logo-knockout: #0e1726; }
      .light { background: #f4efe6; color: #0e1726; --logo-knockout: #f4efe6; --gold-soft: #a88d5f; --gold: #a88d5f; }
      .mark-only { width: 460px; }
      .name { font-family: 'Cormorant Garamond', serif; font-weight: 500; font-size: 34px; letter-spacing: 0.1em; text-transform: uppercase; line-height: 1; white-space: nowrap; }
      .desc { margin-top: 14px; font-size: 14px; font-weight: 600; letter-spacing: 0.34em; text-transform: uppercase; color: var(--gold-soft); }
      .light .desc { color: var(--gold); }
    </style>
  </head>
  <body>
    <template id="mark">
      <svg viewBox="0 0 60 72" fill="none">
        <g stroke="var(--gold)" stroke-linecap="square">
          <path d="M8 66V30a22 22 0 0 1 44 0v36" stroke-width="1.3" />
          <path d="M12.5 66V30a17.5 17.5 0 0 1 35 0v36" stroke-width="0.6" opacity="0.55" />
          <path d="M3 66.5h54" stroke-width="1.3" />
          <path d="M6 70h48" stroke-width="0.6" opacity="0.55" />
        </g>
        <path d="M30 4.2 33.4 8 30 11.8 26.6 8Z" fill="var(--gold)" />
        <text x="34.5" y="52" text-anchor="middle" font-family="'Cormorant Garamond', Georgia, serif" font-size="34" font-weight="500" fill="var(--gold-soft)">B</text>
        <text x="26" y="58" text-anchor="middle" font-family="'Cormorant Garamond', Georgia, serif" font-size="42" font-style="italic" font-weight="500" fill="currentColor" stroke="var(--logo-knockout)" stroke-width="2.2" paint-order="stroke">S</text>
      </svg>
    </template>

    <section id="dark-full" class="panel dark">
      <span class="slot" style="width: 150px; height: 180px"></span>
      <div><div class="name">Muhammad Shoaib Bahadar</div><div class="desc">Legal Counsel</div></div>
    </section>
    <section id="light-full" class="panel light">
      <span class="slot" style="width: 150px; height: 180px"></span>
      <div><div class="name">Muhammad Shoaib Bahadar</div><div class="desc">Legal Counsel</div></div>
    </section>
    <section id="dark-mark" class="panel dark mark-only">
      <span class="slot" style="width: 250px; height: 300px"></span>
    </section>

    <script>
      const tpl = document.getElementById('mark');
      document.querySelectorAll('.slot').forEach((slot) => {
        const svg = tpl.content.firstElementChild.cloneNode(true);
        svg.setAttribute('width', slot.style.width);
        svg.setAttribute('height', slot.style.height);
        slot.replaceWith(svg);
      });
    </script>
  </body>
</html>
